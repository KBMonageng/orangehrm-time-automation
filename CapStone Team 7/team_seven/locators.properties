# Login Page
login.username=input[name='username']
login.password=input[name='password']
login.button=button[type='submit']
login.error=.oxd-alert-content-text

# Common Page Elements
common.page.heading=h6.oxd-text--h6
common.body=body
common.toast=text=Successfully Saved

# Dashboard / Side Menu
dashboard.timeMenu=a[href*='/time/viewTimeModule']

# Time Module - Attendance
attendance.timeMenu=a[href*='/time/viewTimeModule']
attendance.attendanceMenu=span.oxd-topbar-body-nav-tab-item:has-text('Attendance')
attendance.myRecordsMenu=.oxd-dropdown-menu li:has-text('My Records')
attendance.viewButton=button:has-text('View')
attendance.recordsContainer=.orangehrm-container

# Punch In / Out Page
punch.inHeading=text=Punch In
punch.outHeading=text=Punch Out
punch.comment=textarea[placeholder='Type here']
punch.inButton=button:has-text('In')
punch.outButton=button:has-text('Out')
punch.successMessage=text=Successfully Saved

# Shared Timesheet Locators
timesheet.timeMenu=a[href*='/time/viewTimeModule']
timesheet.timesheetsMenu=.oxd-topbar-body-nav-tab-item:has-text('Timesheets')
timesheet.myTimesheetsMenu=.oxd-dropdown-menu li:has-text('My Timesheets')
timesheet.createTimesheetButton=button:has-text('Create Timesheet')
timesheet.resetButton=button:has-text('Reset')
timesheet.editButton=button:has-text('Edit')
timesheet.addRowButton=button:has-text('Add Row')
timesheet.projectInput=input[placeholder='Type for hints...']
timesheet.activityDropdown=xpath=(//div[contains(@class,'oxd-select-text')])[1]
timesheet.hoursInputs=xpath=//table//tbody//input[not(@placeholder='Type for hints...')]
timesheet.saveButton=button:has-text('Save')
timesheet.submitButton=button:has-text('Submit')
timesheet.successMessage=text=Successfully Saved
timesheet.container=.orangehrm-container
timesheet.submittedText=text=Submitted
timesheet.approvedText=text=Approved

# Submit Timesheet Page
submit.timeMenu=a[href*='/time/viewTimeModule']
submit.timesheetsMenu=.oxd-topbar-body-nav-tab-item:has-text('Timesheets')
submit.myTimesheetsMenu=.oxd-dropdown-menu li:has-text('My Timesheets')
submit.createTimesheetButton=button:has-text('Create Timesheet')
submit.resetButton=button:has-text('Reset')
submit.editButton=button:has-text('Edit')
submit.addRowButton=button:has-text('Add Row')
submit.projectInput=input[placeholder='Type for hints...']
submit.activityDropdown=xpath=(//div[contains(@class,'oxd-select-text')])[1]
submit.hoursInputs=xpath=//table//tbody//input[not(@placeholder='Type for hints...')]
submit.saveButton=button:has-text('Save')
submit.submitButton=button:has-text('Submit')
submit.successMessage=text=Successfully Saved
submit.timesheetContainer=.orangehrm-container
submit.pageHeading=h6.oxd-text--h6
submit.submittedText=text=Submitted
submit.approvedText=text=Approved

# Approval Workflow Page
approval.timeMenu=a[href*='/time/viewTimeModule']
approval.employeeInput=input[placeholder='Type for hints...']
approval.employeeOption=.oxd-autocomplete-option
approval.viewButton=button:has-text('View')
approval.body=body
approval.createTimesheetButton=button:has-text('Create Timesheet')
approval.resetButton=button:has-text('Reset')
approval.editButton=button:has-text('Edit')
approval.addRowButton=button:has-text('Add Row')
approval.projectInput=input[placeholder='Type for hints...']
approval.activityDropdown=xpath=(//div[contains(@class,'oxd-select-text')])[1]
approval.hoursInputs=xpath=//table//tbody//input[not(@placeholder='Type for hints...')]
approval.saveButton=button:has-text('Save')
approval.submitButton=button:has-text('Submit')
approval.commentBox=textarea[placeholder='Type here']
approval.approveButton=button:has-text('Approve')
approval.successMessage=text=Successfully Saved
approval.timesheetContainer=.orangehrm-container
approval.submittedText=text=Submitted
approval.approvedText=text=Approved
